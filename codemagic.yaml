workflows:
  android-workflow:
    name: Android Release APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Build APK
        script: |
          flutter packages pub get
          flutter build apk --release --no-sound-null-safety
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
